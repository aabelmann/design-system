services:
  nuxt:
    image: node:26
    working_dir: /app
    init: true
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - nuxt_node_modules:/app/node_modules
    environment:
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
      NUXT_TELEMETRY_DISABLED: 1
    command: sh -c "npm ci && npm start"

volumes:
  nuxt_node_modules:
